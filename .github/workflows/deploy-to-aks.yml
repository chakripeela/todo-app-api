name: Build and Deploy to AKS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/todo-api:${{ github.sha }} .
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/todo-api:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/todo-api:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/todo-api:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/todo-api:latest

      - name: Update deployment image
        run: |
          sed -i 's|<ACR_LOGIN_SERVER>|${{ secrets.ACR_LOGIN_SERVER }}|g' k8s/deployment.yml
          sed -i 's|<IMAGE_TAG>|${{ github.sha }}|g' k8s/deployment.yml

      - name: Set AKS context
        run: |
          az aks get-credentials --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_CLUSTER_NAME }} --overwrite-existing

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml
          kubectl rollout status deployment/todo-api -n default

      - name: Verify deployment
        run: |
          kubectl get pods
          kubectl get svc
