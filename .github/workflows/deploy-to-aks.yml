name: Build and Deploy to AKS

on: workflow_dispatch

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: todo-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v3

      - name: Azure Login with OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Set up QEMU for ARM64 builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        run: |
          docker buildx build --platform linux/arm64 \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --push \
            .

      - name: Update deployment image
        run: |
          sed -i 's|<ACR_LOGIN_SERVER>|${{ env.REGISTRY }}|g' k8s/deployment.yml
          sed -i 's|<IMAGE_TAG>|${{ github.sha }}|g' k8s/deployment.yml

      - name: Update secret provider class
        run: |
          sed -i 's|<key_vault_secrets_provider_client_id>|${{ secrets.KV_SECRETS_PROVIDER_CLIENT_ID }}|g' k8s/secret-provider-class.yml
          sed -i 's|<your-tenant-id>|${{ secrets.AZURE_TENANT_ID }}|g' k8s/secret-provider-class.yml

      - name: Set AKS context
        run: |
          az aks get-credentials --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_CLUSTER_NAME }} --overwrite-existing

      - name: Create prerequisites
        run: |
          kubectl create serviceaccount todo-api --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/secret-provider-class.yml
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml
          kubectl rollout status deployment/todo-api -n default --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods
          kubectl get svc
