apiVersion: v1
kind: Service
metadata:
  name: todo-api
  labels:
    app: todo-api
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  loadBalancerIP: "10.1.2.250"
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: todo-api
