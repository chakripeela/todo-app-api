apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-secrets
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "<key_vault_secrets_provider_client_id>"
    keyvaultName: "todo-api-secrets"
    objects: |
      array:
        - |
          objectName: db-server
          objectType: secret
        - |
          objectName: db-name
          objectType: secret
        - |
          objectName: managed-identity-client-id
          objectType: secret
    tenantId: "<your-tenant-id>"
